<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>العد التنازلي لرمضان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#f8f5ee}body{font-family:'Cairo','Amiri',Tahoma,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}.stage{width:100%;height:100dvh;background:#000;display:flex;align-items:center;justify-content:center}.scene{position:relative;width:100%;height:25.2vh;min-height:230px;max-height:390px;overflow:hidden;text-align:center;background:linear-gradient(180deg,#02040e 0%,#060b20 46%,#071733 100%);box-shadow:0 0 1px #17223b}.stars{position:absolute;inset:0;opacity:.75;background-image:radial-gradient(1px 1px at 8% 13%,#b8c6e2 60%,transparent 100%),radial-gradient(1px 1px at 22% 24%,#6f83aa 60%,transparent 100%),radial-gradient(1px 1px at 41% 10%,#fff 60%,transparent 100%),radial-gradient(1px 1px at 56% 28%,#8799c1 60%,transparent 100%),radial-gradient(1px 1px at 73% 17%,#fff 60%,transparent 100%),radial-gradient(1px 1px at 88% 34%,#7186b0 60%,transparent 100%),radial-gradient(1px 1px at 15% 56%,#7186b0 60%,transparent 100%),radial-gradient(1px 1px at 64% 60%,#fff 60%,transparent 100%),radial-gradient(1px 1px at 34% 71%,#6479a5 60%,transparent 100%),radial-gradient(1px 1px at 95% 72%,#fff 60%,transparent 100%),radial-gradient(1px 1px at 48% 46%,#6479a5 60%,transparent 100%)}.moon{position:absolute;right:8%;top:12%;width:27px;height:27px;border-radius:50%;background:#fffef8;box-shadow:4px 1px 0 #d9b74d,0 0 12px #fff8c5}.content{position:relative;z-index:2;padding-top:14%;margin:auto;width:100%}.kicker{font-size:7px;letter-spacing:.5px;color:#d7cda7;font-weight:600}h1{margin:5px 0 3px;font-family:'Amiri','Cairo',serif;font-size:clamp(25px,6vw,35px);line-height:1.15;color:#e4c65f;text-shadow:0 0 9px #d6b64d55;font-weight:700}.sub{font-size:9px;color:#c8c7c4;margin-top:5px}.timer{display:flex;justify-content:center;gap:clamp(12px,4vw,30px);margin:12px auto 0;direction:rtl}.unit{min-width:40px}.number{display:block;font-family:'Cairo',sans-serif;font-size:clamp(22px,5vw,30px);line-height:1.05;color:#f6f5f1;font-weight:400;font-variant-numeric:tabular-nums}.label{display:block;margin-top:5px;font-size:8px;color:#d7c76d}.date{margin-top:12px;color:#c7c5cb;font-family:'Amiri',serif;font-size:13px}.skyline{position:absolute;bottom:0;left:0;width:100%;height:23%;background:#02040a;clip-path:polygon(0 45%,8% 45%,8% 56%,17% 56%,17% 47%,21% 47%,21% 63%,28% 63%,28% 38%,31% 38%,31% 24%,34% 24%,34% 61%,40% 61%,40% 10%,44% 10%,44% 0,48% 0,48% 62%,55% 62%,55% 41%,59% 41%,59% 56%,64% 56%,64% 29%,67% 29%,67% 61%,75% 61%,75% 44%,80% 44%,80% 60%,87% 60%,87% 39%,90% 39%,90% 60%,100% 60%,100% 100%,0 100%)}.skyline:after{content:"";position:absolute;left:46%;bottom:0;width:7%;height:78%;background:#000;border-radius:50% 50% 0 0}.ground{position:absolute;bottom:0;left:0;width:100%;height:7%;background:linear-gradient(#080d1a,#03050b);border-top:1px solid #a18b4b55}@media(min-width:700px){.scene{height:36vh;max-height:440px}.content{padding-top:10%}.moon{width:35px;height:35px}}
</style>
</head>
<body><div class="stage"><section class="scene" aria-label="العد التنازلي لرمضان"><div class="stars"></div><div class="moon"></div><div class="content"><div class="kicker">العدّ التنازلي للشهر الكريم</div><h1>رمضان كريم</h1><div class="sub">نعدّ الأيام حتى شهر البركة والرحمة</div><div class="timer"><div class="unit"><span class="number" id="days">000</span><span class="label">يوم</span></div><div class="unit"><span class="number" id="hours">00</span><span class="label">ساعة</span></div><div class="unit"><span class="number" id="minutes">00</span><span class="label">دقيقة</span></div><div class="unit"><span class="number" id="seconds">00</span><span class="label">ثانية</span></div></div><div class="date" id="date">٨ فبراير ٢٠٢٧</div></div><div class="skyline"></div><div class="ground"></div></section></div>
<script>
const target=new Date('2027-02-08T00:00:00+02:00').getTime();const pad=n=>String(n).padStart(2,'0');const arabic=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);function tick(){let s=Math.max(0,Math.floor((target-Date.now())/1000));document.getElementById('days').textContent=arabic(String(Math.floor(s/86400)).padStart(2,'0'));document.getElementById('hours').textContent=arabic(pad(Math.floor(s%86400/3600)));document.getElementById('minutes').textContent=arabic(pad(Math.floor(s%3600/60)));document.getElementById('seconds').textContent=arabic(pad(s%60));if(s===0)document.getElementById('date').textContent='رمضان كريم، تقبّل الله منكم'}tick();setInterval(tick,1000);
</script></body></html>
